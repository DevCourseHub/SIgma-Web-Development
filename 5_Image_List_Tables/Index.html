<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images,Lists,Table</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body bgcolor="cyan">
    <p>Image</p>
    <img height="250" src="coding.png" alt="Coding"> <!--src is used to add the source of image and if image not available the alt show -->
    <p>Table</p>
    <table>
        <tr> <!-- table row-->
            <Th>Name</Th> 
            <th>age</th>
        </tr>
        <tr>
            <td rowspan="2">Apple</td>
            <td colspan="2">20</td>
        </tr>
        <tr>
            <td>Mango</td>
            <td>62</td>
        </tr>
        </tr>
    </table>
    
</body>
</html>
